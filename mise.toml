[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
hadolint = "2.15.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install --mise
"""

[tasks.build]
description = "Build the application"
run = """
docker buildx build --platform linux/amd64 -t ghcr.io/joeckr/oci-modified:test . --load
"""

[tasks.compose]
description = "Run Docker Compose"
run = """
docker compose up -d --build
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""

[tasks.trivy-image]
description = "Run Trivy on the Docker image"
depends = ["build"]
run = """
trivy image ghcr.io/joeckr/oci-modified:test
"""
