[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
hadolint = "2.15.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install --mise
"""

[tasks.build]
description = "Build the application"
run = """
podman buildx build --platform linux/amd64 -t ghcr.io/joeckr/mariadb:test . --load
"""

[tasks.compose]
description = "Run Podman Compose"
run = """
podman compose up -d --build
"""

[tasks.compose-up]
description = "Run Podman Compose with upstream image"
run = """
podman compose -f compose.upstream.yml up -d
"""

[tasks.play]
description = "Run Podman Play for local helm chart testing"
depends = ["helm-template"]
run = """
podman play kube rendered.yaml
"""

[tasks.down]
description = "Stop Podman Compose"
run = """
podman compose down
"""

[tasks.down-up]
description = "Stop Podman Compose for upstream image"
run = """
podman compose -f compose.upstream.yml down
"""

[tasks.downplay]
description = "Run Podman Play for local helm chart testing"
depends = ["helm-dep"]
run = """
podman play kube rendered.yaml --down
"""

[tasks.logs]
description = "View Podman Compose logs"
run = """
podman compose logs -f
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-lint]
description = "Lint Helm chart"
depends = ["helm-dep"]
run = """
helm lint chart/
"""

[tasks.helm-template]
description = "Render Helm chart templates"
depends = ["helm-dep"]
run = """
helm template test chart/ > rendered.yaml
"""

[tasks.helm-install]
description = "Install Helm chart"
depends = ["helm-dep"]
run = """
helm install test chart/
"""

[tasks.helm-uninstall]
description = "Uninstall Helm chart"
run = """
helm uninstall test
"""

[tasks.helm-dep]
description = "Build Helm chart dependencies"
run = """
helm dependency build chart/
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""

[tasks.trivy-image]
description = "Run Trivy on the Podman image"
depends = ["build"]
run = """
trivy image ghcr.io/joeckr/mariadb:test
"""
