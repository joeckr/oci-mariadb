apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}
    spec:
      {{- with .Values.app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      volumes:
        - name: mariadb-storage
          persistentVolumeClaim:
            claimName: mariadb-pvc
        {{- if .Values.initSchema.enabled }}
        - name: mariadb-schema
          configMap:
            name: mariadb-schema
        {{- end }}
      containers:
        - name: {{ .Values.app.name }}
          {{- with .Values.app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.app.image }}:{{ .Values.app.tag }}"
          imagePullPolicy: {{ .Values.app.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}
              name: {{ .Values.app.name }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.app.db | quote }}
            - name: MARIADB_USER
              value: {{ .Values.app.user | quote }}
            - name: MARIADB_PASSWORD
              value: {{ .Values.app.password | quote }}
            - name: MARIADB_ROOT_PASSWORD
              value: {{ .Values.app.rootPassword | quote }}
          volumeMounts:
            - name: mariadb-storage
              mountPath: /var/lib/mysql
            {{- if .Values.initSchema.enabled }}
            - name: mariadb-schema
              mountPath: /docker-entrypoint-initdb.d/schema.sql
              subPath: schema.sql
            {{- end }}
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
