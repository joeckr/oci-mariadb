app:
  name: mariadb
  replicaCount: 1
  resources:
    limits:
      cpu: 100m
      memory: 200Mi
  image: ghcr.io/joeckr/mariadb
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  port: 3306
  db: mariadb
  user: mariadb
  podAnnotations: {}
  storageAccessMode: ReadWriteOnce
  storageSize: 1Gi
  storageClass: ""
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: 1031
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

initSchema:
  enabled: true

secret:
  # Set create: false or provide existingSecret when managing secrets externally (e.g. External Secrets Operator).
  create: true
  existingSecret: ""
  keys:
    password: "MARIADB_PASSWORD"  # betterleaks:allow
    rootPassword: "MARIADB_ROOT_PASSWORD"  # betterleaks:allow
  data:
    MARIADB_PASSWORD: "changeme"  # betterleaks:allow
    MARIADB_ROOT_PASSWORD: "really_replaceme"  # betterleaks:allow
