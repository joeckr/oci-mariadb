minimum_prek_version = "0.1.0"

# Universal pre commit hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.6.0"
hooks = [
    { id = "no-commit-to-branch", args = ['--branch', 'main', '--branch', 'master'] },
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml", exclude = "^(.*templates/.*|charts/.*|Helm/.*)$" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-xml" },
    { id = "forbid-submodules" },
    { id = "check-merge-conflict" },
    { id = "check-added-large-files" }
]

# commitlint
[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.16.0"
hooks = [
    { id = "commitlint", stages = ["commit-msg"] }
]

# gitleaks
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.18.4"
hooks = [
    { id = "gitleaks-system" }
]

# addlicense
[[repos]]
repo = "local"
hooks = [
    {
        id = "addlicense",
        name = "addlicense",
        entry = "mise exec -- addlicense",
        language = "system",
        args = [
            "-c", "Joseph Christopher King",
            "-l", "mit",
            "-v"
        ],
        types_or = ["python", "go", "javascript", "rust"]
    },
    {
        id = "helm-lint",
        name = "helm-lint",
        entry = "helm lint chart/",
        language = "system",
        files = "^.*(Chart\\.yaml|values\\.yaml|templates/.*\\.yaml)$",
        pass_filenames = false
    },

]

# actionlint
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" }
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.1"
hooks = [
  { id = "zizmor" }
]

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [
  { id = "hadolint" }
]

# shellcheck
[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [
  { id = "shellcheck" }
]
