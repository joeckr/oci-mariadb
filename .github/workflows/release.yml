name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      dependabot-semver: true

  build:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/build-oci.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      image: 'mariadb'
      version: ${{ needs.release.outputs.version }}

  helm:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      charts-dir: 'chart'
