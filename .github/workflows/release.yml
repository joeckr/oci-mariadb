name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      dependabot-semver: true

  build:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: joeckr/ci-templates/.github/workflows/build-oci.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      image: 'mariadb'
      version: ${{ needs.release.outputs.version }}

  helm:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      charts-dir: 'chart'
