name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@db877801751041f06adcca7e4b9b3a1973ac563e  # v1.21.0

  build:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/build-oci.yml@db877801751041f06adcca7e4b9b3a1973ac563e  # v1.21.0
    with:
      image: 'mariadb'
      version: ${{ needs.release.outputs.version }}

  helm:
    needs: [release]
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@db877801751041f06adcca7e4b9b3a1973ac563e  # v1.21.0
    with:
      charts-dir: 'chart'
