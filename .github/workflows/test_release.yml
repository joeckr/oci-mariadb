name: TEST Release

on:
  pull_request:
    branches: [main]

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      charts-dir: 'chart'
      dry-run: true
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      dry-run: true
      dependabot-semver: true
  build:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/build-oci.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
    with:
      image: 'mariadb'
      version: 'test'
      dry-run: true
