name: TEST Release

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
    with:
      charts-dir: 'chart'
      dry-run: true
  release:
    permissions:
      contents: write
    uses: joeckr/ci-templates/.github/workflows/semantic.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
    with:
      dry-run: true
      dependabot-semver: true
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: joeckr/ci-templates/.github/workflows/build-oci.yml@697db8faa5f8d3fa5ec15ef35674aa1e855d3a33  # v1.23.1
    with:
      image: 'mariadb'
      version: 'test'
      dry-run: true
