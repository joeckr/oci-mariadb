name: Cleanup GHCR

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview versions to delete without deleting them'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/cleanup-ghcr.yml@6cd1b691f0f8aa3e52366007220d6b007d685275  # v1.24.0
    with:
      package: 'mariadb'
      keep-untagged-days: 14
      dry-run: ${{ inputs.dry-run || false }}
