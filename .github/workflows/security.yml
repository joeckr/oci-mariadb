name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  betterleaks:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/betterleaks.yml@6ef7c291b7ec4a74e632d7adfef333ff4c90cb79  # v1.12.0
  zizmor:
    permissions:
      contents: read
      security-events: write # required to upload SARIF results to GitHub Advanced Security
    uses: joeckr/ci-templates/.github/workflows/zizmor.yml@c08d40f0bf0cd80de6b2f1fa2f018f944265b807 # v1.8.0
