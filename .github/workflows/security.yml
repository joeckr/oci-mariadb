name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  betterleaks:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/betterleaks.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
  sbom:
    permissions:
      contents: read
    uses: joeckr/ci-templates/.github/workflows/sbom.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
  trivy:
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results to GitHub Advanced Security
    uses: joeckr/ci-templates/.github/workflows/trivy-fs.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
  zizmor:
    permissions:
      contents: read
      security-events: write  # required to upload SARIF results to GitHub Advanced Security
    uses: joeckr/ci-templates/.github/workflows/zizmor.yml@72b33f74ac8adf0635cd94db83a71c731e836eab  # v1.22.0
