name: Image CVE Scan

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: joeckr/ci-templates/.github/workflows/trivy-image.yml@1c6283577ea8eabcda150cb4f2a9749b3c610b1d  # v1.24.1
    with:
      image-ref: 'ghcr.io/joeckr/mariadb:latest'
